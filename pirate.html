<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" /><meta name="theme-color" content="#075e78" />
  <script>
    // Start downloads before the UI module, with cancellable requests rather
    // than load-blocking preload links. The scene reuses these exact buffers.
    {
      const downloads = window.__pirateModelDownloads = new Map();
      for (const name of ['barrel', 'pirate', 'knife']) {
        const url = new URL(`./models/${name}.glb?v=20261027-bounded-load`, location.href).href;
        const gateway = /^(www\.)?noltap\.com$/.test(location.hostname);
        const source = gateway ? new URL(`./api/pirate-model.php?name=${name}&v=1`, location.href).href : url;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 12000);
        const download = fetch(source, { signal: controller.signal }).then(async response => {
          if (!response.ok) throw new Error(`Model HTTP ${response.status}`);
          if (!gateway) return response.arrayBuffer();
          const payload = await response.json();
          const binary = atob(payload.data);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          return bytes.buffer;
        }).finally(() => clearTimeout(timer));
        download.catch(() => {});
        downloads.set(url, download);
      }
    }
  </script>
  <title>통통! 해적 룰렛 — 놀탭 NOLTAP</title>
  <meta name="description" content="최대 8명이 한 기기에서 각자 칼 색을 고르고 차례로 플레이하는 3D 해적 룰렛. 나무통의 함정을 피해 10라운드 동안 점수를 겨뤄요." />
